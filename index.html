        return MEDICINE_CATALOG.filter(med => {
          const matchesCategory = selectedCategory === 'All' || med.category === selectedCategory;

          if (!q) return matchesCategory;

          const matchesBrand = med.brandName.toLowerCase().includes(q);
          const matchesSalt = med.activeSalt.toLowerCase().includes(q);
          const matchesGeneric = med.generics.some(g => g.name.toLowerCase().includes(q) || g.manufacturer.toLowerCase().includes(q));
          
          return matchesCategory && (matchesBrand || matchesSalt || matchesGeneric);
        });
      }, [searchQuery, selectedCategory]);

      const cartCalculations = useMemo(() => {
        let subtotal = 0;
        let totalBrandedEquivalentMrp = 0;
        let hasScheduleH = false;

        cart.forEach(item => {
          subtotal += item.price * item.quantity;
          totalBrandedEquivalentMrp += item.brandedMrp * item.quantity;
          if (item.scheduleH) {
            hasScheduleH = true;
          }
        });

        const deliveryFee = cart.length > 0 ? 50 : 0;
        const totalPayable = subtotal + deliveryFee;
        const totalSavings = Math.max(0, totalBrandedEquivalentMrp - subtotal);
        const savingsPercentage = totalBrandedEquivalentMrp > 0 
          ? Math.round((totalSavings / totalBrandedEquivalentMrp) * 100) 
          : 0;

        return {
          subtotal,
          deliveryFee,
          totalPayable,
          totalBrandedEquivalentMrp,
          totalSavings,
          savingsPercentage,
          hasScheduleH
        };
      }, [cart]);

      const addToCart = (medicine, generic) => {
        setCart(prev => {
          const existing = prev.find(item => item.genericId === generic.id);
          if (existing) {
            return prev.map(item => 
              item.genericId === generic.id 
                ? { ...item, quantity: item.quantity + 1 } 
                : item
            );
          } else {
            return [...prev, {
              genericId: generic.id,
              medicineId: medicine.id,
              name: generic.name,
              brandEquivalent: medicine.brandName,
              activeSalt: medicine.activeSalt,
              manufacturer: generic.manufacturer,
              price: generic.price,
              brandedMrp: medicine.brandedMrp,
              quantity: 1,
              scheduleH: medicine.scheduleH,
              unit: medicine.unit,
              bioequivalenceRatio: generic.bioequivalenceRatio
            }];
          }
        });

        setCart(prev => prev.map(item => {
          if (item.genericId === genericId) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));

              medicineId: med.id,
              name: lowestCostGen.name,
              brandEquivalent: med.brandName,
              activeSalt: med.activeSalt,
              manufacturer: lowestCostGen.manufacturer,
              price: lowestCostGen.price,
              brandedMrp: med.brandedMrp,
              quantity: 1,
              scheduleH: med.scheduleH,
              unit: med.unit,
              bioequivalenceRatio: lowestCostGen.bioequivalenceRatio

        setShowOrderSuccessModal(true);

                          <div className="flex items-center space-x-4">
                            <button

                {/* PAST ORDERS & REORDER HISTORICAL TABLE */}

                            <td className="py-3 text-right">

                              >

                            </td>
                          </tr>

                      </tbody>
                    </table>
                  </div>
                </div>

              </div>

                <p className="text-[11px] text-gray-400">

                </p>
              </div>
              <div className="flex items-center space-x-4 text-emerald-800 font-semibold">
                <span>✓ CDSCO Standards Compliant</span>
                <span>✓ Telangana State Drug Control Verified</span>

                <div className="flex items-start justify-between border-b border-gray-100 pb-3">
                  <div>
                    <span className="bg-bereal-100 text-bereal-700 text-xs px-2.5 py-0.5 rounded-full font-bold">
                      Clinical Chemical Equivalence Test
                    </span>
                    <h2 className="text-xl font-extrabold text-gray-900 mt-1">
                      {selectedComparison.brandName} vs Generic Alternatives
                    </h2>
                    <p className="text-xs text-emerald-800 font-semibold">
                      Active Molecule: {selectedComparison.activeSalt} ({selectedComparison.strength})
                    </p>
                  </div>
                  <button 
                    onClick={() => setSelectedComparison(null)}
                    className="w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center font-bold"

                    ✕
                  </button>
                </div>

                        <th className="p-3 border-b">Feature / Parameter</th>
                        <th className="p-3 border-b bg-amber-50/50 text-amber-900">Reference Branded Drug</th>
                        {selectedComparison.generics.map(g => (
                          <th key={g.id} className="p-3 border-b bg-emerald-50/50 text-emerald-900">

                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-200 text-gray-700">
                      <tr>
                        <td className="p-3 font-semibold">Manufacturer</td>

                          <td key={g.id} className="p-3 bg-emerald-50/10 font-medium">{g.manufacturer}</td>

                      <tr>
                        <td className="p-3 font-semibold">Active Salt & Potency</td>
                        <td className="p-3 bg-amber-50/20 font-bold text-gray-900">{selectedComparison.activeSalt}</td>

                          <span className="text-base font-black text-gray-900">₹{ord.totalPayable}</span>
                          <span className="block text-[10px] text-gray-500">Includes ₹50 platform fee</span>

                          <div key={i} className="bg-white p-2 rounded-lg border border-gray-200 flex justify-between">
                            <span className="font-semibold text-gray-800">{it.qty}x {it.name}</span>

                          </div>

                      </div>

                      {/* Pharmacist Verification Note */}
                      <div className="bg-emerald-50/70 p-2.5 rounded-xl border border-emerald-200 text-[11px] text-emerald-900 flex items-center justify-between">

                        <button 
                          onClick={() => alert(`Pharmacist dispatch slip printed for ${ord.orderId}. Delivery boy assigned.`)}

                          Print Dispatch Label
                        </button>
                      </div>
                    </div>

                <div className="flex justify-end pt-2">
                  <button 
                    onClick={() => setShowQueueModal(false)}

            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">

                <div className="w-14 h-14 bg-emerald-100 text-bereal-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                  ✓
                </div>
                <div>
                  <span className="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-bold">
                    Order Confirmed & Routed
                  </span>
                  <h2 className="text-xl font-black text-gray-900 mt-2">Order {lastPlacedOrder.orderId}</h2>

                </div>

                {/* Itemized Receipt */}
                <div className="bg-gray-50 p-4 rounded-2xl border border-gray-200 text-left text-xs space-y-2">
                  <div className="flex justify-between text-gray-600">
                    <span>Medicines Subtotal:</span>
                    <span className="font-bold text-gray-900">₹{lastPlacedOrder.subtotal}</span>
                  </div>
                  <div className="flex justify-between text-gray-600">
                    <span>Platform & Delivery Fee:</span>
                    <span className="font-bold text-gray-900">₹{lastPlacedOrder.deliveryFee}</span>

                    <span className="text-bereal-600 text-base">₹{lastPlacedOrder.totalPayable}</span>
                  </div>
                  <div className="text-[11px] text-emerald-700 font-bold text-center pt-1">

                </div>

                <div className="text-[11px] text-gray-500">

                </div>

                <button 
                  onClick={() => setShowOrderSuccessModal(false)}

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BeRealApp />);
  </script>
